<div class="login-container"><mat-card><mat-card-header><mat-card-title>Login to CodeBridge</mat-card-title></mat-card-header><mat-card-content><form [formGroup]="loginForm" (ngSubmit)="onSubmit()"><mat-form-field appearance="outline"><mat-label>Email (Username)</mat-label><input matInput formControlName="username" type="email" placeholder="Enter your email"><mat-error *ngIf="loginForm.get('username')?.hasError('required')">Email is required</mat-error><mat-error *ngIf="loginForm.get('username')?.hasError('email')">Invalid email format</mat-error></mat-form-field><mat-form-field appearance="outline"><mat-label>Password</mat-label><input matInput formControlName="password" type="password" placeholder="Enter your password"><mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error></mat-form-field><div class="login-actions"><button mat-raised-button color="primary" type="submit" [disabled]="isLoading"><span *ngIf="!isLoading">Login</span><mat-spinner *ngIf="isLoading" diameter="24" style="display: inline-block; margin: 0 8px;"></mat-spinner></button></div><p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p></form></mat-card-content></mat-card></div>
