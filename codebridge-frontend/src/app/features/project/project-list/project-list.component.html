<div class="project-list-container">
  <div class="header-container">
    <h1>Projects</h1>
    <button mat-raised-button color="primary" (click)="createProject()">
      <mat-icon>add</mat-icon>
      Create Project
    </button>
  </div>

  <div class="content-container">
    <mat-card>
      <mat-card-content>
        <div *ngIf="loading" class="loading-container">
          <mat-spinner diameter="40"></mat-spinner>
          <p>Loading projects...</p>
        </div>

        <div *ngIf="error" class="error-container">
          <mat-icon color="warn">error</mat-icon>
          <p>Failed to load projects. Please try again.</p>
          <button mat-button color="primary" (click)="loadProjects()">Retry</button>
        </div>

        <div *ngIf="!loading && !error">
          <div *ngIf="projects.length === 0" class="empty-state">
            <mat-icon>folder</mat-icon>
            <h2>No projects found</h2>
            <p>Create your first project to get started</p>
            <button mat-raised-button color="primary" (click)="createProject()">Create Project</button>
          </div>

          <table mat-table [dataSource]="projects" class="mat-elevation-z2" *ngIf="projects.length > 0">
            <!-- Name Column -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let project">{{ project.name }}</td>
            </ng-container>

            <!-- Description Column -->
            <ng-container matColumnDef="description">
              <th mat-header-cell *matHeaderCellDef>Description</th>
              <td mat-cell *matCellDef="let project">{{ project.description || 'No description' }}</td>
            </ng-container>

            <!-- Created At Column -->
            <ng-container matColumnDef="createdAt">
              <th mat-header-cell *matHeaderCellDef>Created</th>
              <td mat-cell *matCellDef="let project">{{ project.createdAt | date:'medium' }}</td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let project">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Project actions">
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="viewProject(project.id)">
                    <mat-icon>visibility</mat-icon>
                    <span>View</span>
                  </button>
                  <button mat-menu-item (click)="editProject(project.id)">
                    <mat-icon>edit</mat-icon>
                    <span>Edit</span>
                  </button>
                  <button mat-menu-item (click)="deleteProject(project)">
                    <mat-icon color="warn">delete</mat-icon>
                    <span>Delete</span>
                  </button>
                </mat-menu>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" 
                class="project-row" 
                (click)="viewProject(row.id)"></tr>
          </table>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
